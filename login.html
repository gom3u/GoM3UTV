<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - GoM3U TV</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-box {
            width: 320px; margin: 100px auto; padding: 30px;
            background: #1e293b; border-radius: 12px; text-align: center;
        }
        .login-box input {
            width: 100%; padding: 10px; margin: 10px 0;
            border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white;
        }
        .login-box button {
            width: 100%; padding: 10px; background: var(--accent-color);
            border: none; color: white; border-radius: 6px; cursor: pointer;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="login-box">
        <h2>GoM3U Admin</h2>
        <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 5px;">Enter Admin Password</p>
        <input type="password" id="admin-pass" placeholder="Password (Default: admin123)">
        <button id="login-btn">Login</button>
    </div>
    <script>
        document.getElementById('login-btn').addEventListener('click', () => {
            const pass = document.getElementById('admin-pass').value;
            if (pass === 'admin123') { // Configurable password
                sessionStorage.setItem('gom3u_admin_auth', 'true');
                window.location.href = 'admin.html';
            } else {
                alert('Invalid password!');
            }
        });
    </script>
</body>
</html>
