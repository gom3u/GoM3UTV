<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoM3U TV - Live Web TV</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="dark-theme">

    <!-- Ticker Notice Bar -->
    <div id="ticker-bar" class="ticker-bar hidden">
        <span id="ticker-text"></span>
    </div>

    <!-- Maintenance / Alert Modal -->
    <div id="popup-modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title">Notice</h2>
            <p id="modal-body"></p>
            <button id="close-modal-btn">Dismiss</button>
        </div>
    </div>

    <!-- Main TV Layout -->
    <div class="tv-container">
        
        <!-- Sidebar Navigation & Categories -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <h1>GoM3U <span>TV</span></h1>
            </div>

            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search channel... (Press /)">
            </div>

            <nav class="categories">
                <h3>Categories</h3>
                <ul id="category-list">
                    <li class="active" data-cat="all">All Channels</li>
                    <li data-cat="favorites">⭐ Favorites</li>
                    <li data-cat="recent">🕒 Recently Watched</li>
                </ul>
            </nav>

            <div class="channel-list-container">
                <div id="channel-list" class="channel-grid">
                    <!-- Channels rendered dynamically -->
                </div>
            </div>
        </aside>

        <!-- Main Video Player Stage -->
        <main class="player-stage">
            <div class="video-wrapper" id="video-wrapper">
                <video id="video-player" playsinline></video>
                
                <!-- Loading & Buffer Indicators -->
                <div id="player-loader" class="loader-overlay hidden">
                    <div class="spinner"></div>
                    <p id="loader-status">Loading channel...</p>
                </div>

                <!-- Video Controls Overlay -->
                <div class="player-overlay" id="player-controls">
                    <div class="channel-info-overlay">
                        <img id="current-channel-logo" src="" alt="" class="current-logo hidden">
                        <div>
                            <h2 id="current-channel-name">Select a Channel</h2>
                            <p id="current-channel-group"></p>
                        </div>
                    </div>

                    <div class="controls-bar">
                        <button id="btn-play-pause">⏸</button>
                        <button id="btn-fav">⭐</button>
                        <button id="btn-pip">📺 PiP</button>
                        <button id="btn-fullscreen">⛶ Fullscreen</button>
                        
                        <div class="slider-group">
                            <span>🔊</span>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
                        </div>

                        <div class="slider-group">
                            <span>☀️</span>
                            <input type="range" id="brightness-slider" min="0.2" max="1.5" step="0.05" value="1">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
                              </html>
